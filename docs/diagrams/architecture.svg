<text x="56" y="112" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#13202B">Datasets</text>
<text x="56" y="134" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#4A5B66">FLIP2 splits, CSV</text>
<rect x="340" y="80" width="200" height="72" rx="6" fill="#FFFFFF" stroke="#13202B" stroke-width="1"/>
<text x="356" y="112" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#13202B">Representations</text>
<text x="356" y="134" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#4A5B66">ESM-2, 320 numbers</text>
