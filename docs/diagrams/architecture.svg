<text x="956" y="134" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#4A5B66">hides scores until reveal</text>
<rect x="640" y="240" width="200" height="72" rx="6" fill="#FFFFFF" stroke="#13202B" stroke-width="1"/>
<text x="656" y="272" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#13202B">Gemini</text>
<text x="656" y="294" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#4A5B66">optional advisor</text>
<rect x="940" y="240" width="200" height="72" rx="6" fill="#F6E3D6" stroke="#A84A12" stroke-width="1.5"/>
<text x="956" y="272" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#13202B">Rewards</text>
<text x="956" y="294" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#4A5B66">warnings, bounded repair</text>
<rect x="940" y="400" width="200" height="72" rx="6" fill="#FFFFFF" stroke="#13202B" stroke-width="1"/>
<text x="956" y="432" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#13202B">Run records</text>
<text x="956" y="454" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#4A5B66">fingerprinted logs</text>
<rect x="640" y="400" width="200" height="72" rx="6" fill="#FFFFFF" stroke="#13202B" stroke-width="1"/>
<text x="656" y="432" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#13202B">Audits</text>
<text x="656" y="454" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#4A5B66">replay and verify</text>
<rect x="340" y="400" width="200" height="72" rx="6" fill="#FFFFFF" stroke="#13202B" stroke-width="1"/>
<text x="356" y="432" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#13202B">Web workspace</text>
<text x="356" y="454" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#4A5B66">FastAPI and Next.js</text>
<line x1="340" y1="496" x2="372" y2="496" stroke="#4A5B66" stroke-width="1.5"/><text x="380" y="500" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#4A5B66">DATA FLOW</text>
<line x1="500" y1="496" x2="532" y2="496" stroke="#4A5B66" stroke-width="1.5" stroke-dasharray="5,4"/><text x="540" y="500" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#4A5B66">OPTIONAL OR RETURN</text>
<rect x="740" y="488" width="24" height="16" rx="3" fill="#F6E3D6" stroke="#A84A12" stroke-width="1.5"/><text x="772" y="500" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#4A5B66">CERA CONTRIBUTION</text>
</svg>