<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">CERA architecture</title>
<desc id="arch-desc">Datasets feed sequence representations and predictors; the search runner reveals scores, the rewards layer raises warnings and repairs, and records are replayed by audits and summarised in the web workspace.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 9 5 0 9z" fill="#4A5B66"/></marker>
<marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 9 5 0 9z" fill="#A84A12"/></marker>
</defs>
<rect width="1200" height="540" fill="#F7F5F0"/>
<path d="M240 116H340" fill="none" stroke="#4A5B66" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="290" y="108" text-anchor="middle" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" letter-spacing="0.6" fill="#4A5B66">SEQUENCES</text>
<path d="M540 116H640" fill="none" stroke="#4A5B66" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="590" y="108" text-anchor="middle" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" letter-spacing="0.6" fill="#4A5B66">320 VECTORS</text>
<path d="M840 116H940" fill="none" stroke="#4A5B66" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="890" y="108" text-anchor="middle" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" letter-spacing="0.6" fill="#4A5B66">PREDICTIONS</text>
<path d="M1008 152V240" fill="none" stroke="#4A5B66" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="1000" y="200" text-anchor="end" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" letter-spacing="0.6" fill="#4A5B66">MEASURED</text>
<path d="M1072 240V152" fill="none" stroke="#4A5B66" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<text x="1080" y="200" text-anchor="start" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" letter-spacing="0.6" fill="#4A5B66">REPAIR / STOP</text>
<path d="M840 276H940" fill="none" stroke="#4A5B66" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<text x="890" y="268" text-anchor="middle" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" letter-spacing="0.6" fill="#4A5B66">MENU CHOICE</text>
<path d="M1040 312V400" fill="none" stroke="#4A5B66" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="1048" y="360" text-anchor="start" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" letter-spacing="0.6" fill="#4A5B66">LOGGED</text>
<path d="M940 436H840" fill="none" stroke="#4A5B66" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="890" y="428" text-anchor="middle" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" letter-spacing="0.6" fill="#4A5B66">REPLAYED</text>
<path d="M640 436H540" fill="none" stroke="#4A5B66" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="590" y="428" text-anchor="middle" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" letter-spacing="0.6" fill="#4A5B66">SUMMARIES</text>
